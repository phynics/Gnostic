name: verify

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# The smoke targets need only the image and a build, not `make verify`, so they
# run in a parallel job. Each job builds the image from
# .devcontainer/Dockerfile itself; the duplicated image build costs runner
# minutes but not wall-clock time.
jobs:
  verify:
    name: validation matrix
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      # The build directory is the expensive part to recreate. The container
      # image is rebuilt by the first `make` target below and then served from
      # the runner's local layer cache for the rest of the job.
      - name: Restore SwiftPM and build caches
        uses: actions/cache/restore@v6
        with:
          path: |
            /tmp/gnostic-swift-build
            ~/.cache/gnostic/swiftpm
          key: swift-6.4.0-${{ hashFiles('Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            swift-6.4.0-${{ hashFiles('Package.resolved') }}-
            swift-6.4.0-

      # The harness runs on the runner and uses fake runtimes, so it needs no
      # image and fails fast on a stale or broken container command contract.
      - name: make harness-test
        run: make harness-test

      # Every target below builds the image from .devcontainer/Dockerfile via
      # the Makefile, so CI and local development share one dependency list.
      # Restating the apt packages here would let the two drift.
      - name: make container-smoke
        run: make container-smoke

      - name: make verify
        run: make verify

      # Only main saves. A pull request entry is restorable only from its own
      # branch, and each ~1 GB entry pushes main's toward eviction.
      - name: Save SwiftPM and build caches
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v6
        with:
          path: |
            /tmp/gnostic-swift-build
            ~/.cache/gnostic/swiftpm
          key: swift-6.4.0-${{ hashFiles('Package.resolved') }}-${{ github.sha }}

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: testing-logs-${{ github.job }}
          path: .testing/
          # .testing is a dot-directory; without this the upload silently
          # finds nothing and a failed run has no diagnosable output.
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  smoke:
    name: smoke
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Restore SwiftPM and build caches
        uses: actions/cache/restore@v6
        with:
          path: |
            /tmp/gnostic-swift-build
            ~/.cache/gnostic/swiftpm
          key: swift-6.4.0-${{ hashFiles('Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            swift-6.4.0-${{ hashFiles('Package.resolved') }}-
            swift-6.4.0-

      # acp-smoke locates the gnostic executable before `swift test` builds
      # it, so a cold or stale cache needs an explicit build first.
      - name: make build
        run: make build

      - name: make runner-smoke
        run: make runner-smoke

      - name: make acp-smoke
        run: make acp-smoke

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: testing-logs-${{ github.job }}
          path: .testing/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  macos-rlm:
    name: macOS RLM executors
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Set up Swift 6.4
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: '6.4'

      - name: Install Guile
        run: brew install guile

      - name: Build and exercise both RLM workers on macOS
        run: make macos-rlm-smoke
