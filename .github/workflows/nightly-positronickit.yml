name: nightly PositronicKit

# Builds and tests Gnostic against PositronicKit `main` so upstream breakage
# surfaces before a release pins it. Scheduled and manual only: it never runs on
# a pull request and is never a required check, so it cannot block work.
on:
  schedule:
    # Off-peak minute; GitHub's scheduler is busiest on the hour.
    - cron: "23 7 * * *"
  workflow_dispatch:
    inputs:
      ref:
        description: PositronicKit branch to test.
        required: false
        default: main

concurrency:
  group: nightly-positronickit
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  positronickit-main:
    name: build and test against PositronicKit main
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Track PositronicKit head
        run: node Scripts/pin-positronickit-main.mjs "${{ github.event.inputs.ref || 'main' }}"

      # Restore only. A nightly branch resolution must never evict or overwrite
      # the cache main's pulls and pushes save; it falls back to theirs.
      - name: Restore SwiftPM and build caches
        uses: actions/cache/restore@v6
        with:
          path: |
            /tmp/gnostic-swift-build
            ~/.cache/gnostic/swiftpm
          key: nightly-positronickit-${{ github.run_id }}
          restore-keys: |
            nightly-positronickit-
            swift-6.4.0-

      - name: make image
        run: make image

      # Records which upstream commit was tested. make verify then uses locked
      # resolution against the Package.resolved this produces.
      - name: Resolve against PositronicKit head
        run: |
          make resolve
          revision=$(node -e 'const p=JSON.parse(require("fs").readFileSync("Package.resolved","utf8"));const pin=p.pins.find(({identity})=>identity==="positronickit");process.stdout.write(pin.state.revision)')
          echo "POSITRONICKIT_REVISION=$revision" >> "$GITHUB_ENV"
          echo "PositronicKit revision under test: $revision" >> "$GITHUB_STEP_SUMMARY"

      - name: make verify
        run: make verify

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: nightly-positronickit-logs
          path: .testing/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
